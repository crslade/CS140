<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Schedule</title>
  <link rel="stylesheet" href="table.css">
</head>
<body>
  <header>
    <h1>Slade's Web Design</h1>
  </header>
  <main>
    <div class="tablediv">
      <table id="schedule">
        <caption>My Class Schedule</caption>
        <thead>
          <tr>
            <th>Dept.</th>
            <th>Num.</th>
            <th>Name</th>
            <th>Location</th>
            <th>Time</th>
            <th>Credits</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="rowgroup" colspan="6">Fall 2026</th>
          </tr>
          <tr>
            <td>CS</td>
            <td>140</td>
            <td>Web Design</td>
            <td>P2</td>
            <td>11AM</td>
            <td>3</td>
          </tr>
          <tr>
            <td>CS</td>
            <td>401</td>
            <td>Web App Development</td>
            <td>P2</td>
            <td>12PM</td>
            <td>3</td>
          </tr>
          <tr>
            <td>CS</td>
            <td>415</td>
            <td>Operating Systens</td>
            <td>P2</td>
            <td>2PM</td>
            <td>3</td>
          </tr>
        </tbody>
        <tbody>
          <tr>
            <th scope="rowgroup" colspan="6">Winter 2027</th>
          </tr>
          <tr>
            <td rowspan="2">CS</td>
            <td>140</td>
            <td>Web Design</td>
            <td>P2</td>
            <td>11AM</td>
            <td>3</td>
          </tr>
          <tr>
            <td>140</td>
            <td>Web Design</td>
            <td>P2</td>
            <td>12PM</td>
            <td>3</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="5">Total Credits</th>
            <td>15</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </main>
  <footer><p>&copy; 2026 Chris Slade</p></footer>
</body>
</html>
